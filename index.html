  .card.warn .value { color: #c0392b; }
  .card.good .value { color: #1a7f37; }
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  #search {
    padding: 8px 12px;
    border: 1px solid #d0d5dd;
    border-radius: 8px;
    font-size: 14px;
    min-width: 240px;
  }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #444;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid #e4e7ec;
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  thead th {
    background: #fafbfc;
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    border-bottom: 1px solid #e4e7ec;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  thead th:hover { background: #f0f2f5; }
  thead th .arrow { font-size: 10px; color: #999; margin-left: 4px; }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid #f0f1f3;
    white-space: nowrap;
  }
  tbody tr:hover { background: #fafbfc; }
  tbody tr.at-risk { background: #fff5f5; }
  tbody tr.at-risk:hover { background: #ffecec; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.risk { background: #fde2e1; color: #c0392b; }
  .badge.ok { background: #e3f6e5; color: #1a7f37; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  footer { margin-top: 16px; font-size: 12px; color: #888; }

function isAtRisk(b) {
  return b.rtoPct !== null && b.rtoPct >= 25 && (b.delivered + b.rto) >= 10;
}

const COLUMNS = [
  {key:"name", label:"Business", num:false},
  {key:"totalOrders", label:"Total Orders", num:true},
  {key:"sendTotal", label:"Send", num:true},
  {key:"delivered", label:"Delivered", num:true},
  {key:"rto", label:"RTO", num:true},
  {key:"dsrPct", label:"DSR %", num:true},
  {key:"rtoPct", label:"RTO %", num:true},
  {key:"topBranch", label:"Top RTO Branch", num:false},
  {key:"topBranchCount", label:"Branch Cnt", num:true},
  {key:"topGov", label:"Top Governorate", num:false},
  {key:"topGovCount", label:"Gov Cnt", num:true},
];

let sortKey = "totalOrders";
let sortDir = -1;

function renderCards() {
  const withOrders = DATA.filter(b => b.totalOrders > 0);
  let delivered = 0, rto = 0;
  for (const b of DATA) { delivered += b.delivered; rto += b.rto; }
  const denom = delivered + rto;
  const dsr = denom > 0 ? (delivered/denom*100).toFixed(1) : "—";
  const rtoP = denom > 0 ? (rto/denom*100).toFixed(1) : "—";
  const atRiskCount = DATA.filter(isAtRisk).length;
  const cards = [
    {label:"Businesses managed", value: DATA.length},
    {label:"With orders this range", value: withOrders.length},
    {label:"Portfolio DSR", value: dsr + "%", cls:"good"},
    {label:"Portfolio RTO", value: rtoP + "%", cls: rto > delivered ? "warn":""},
    {label:"At-risk businesses", value: atRiskCount, cls: atRiskCount>0 ? "warn":"good"},
  ];
  document.getElementById("cards").innerHTML = cards.map(c =>
    `<div class="card ${c.cls||""}"><div class="label">${c.label}</div><div class="value">${c.value}</div></div>`
  ).join("");
}

function renderHead() {
  const row = document.getElementById("headRow");
  row.innerHTML = COLUMNS.map(c => {
    const arrow = sortKey === c.key ? (sortDir === 1 ? "▲" : "▼") : "";
    return `<th onclick="setSort('${c.key}')">${c.label} <span class="arrow">${arrow}</span></th>`;
  }).join("");
}

function setSort(key) {
  if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
  render();
}

function render() {
  renderCards();
  renderHead();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const onlyOrders = document.getElementById("onlyOrders").checked;
  const onlyRisk = document.getElementById("onlyRisk").checked;

  let rows = DATA.filter(b => {
    if (q && !(b.name.toLowerCase().includes(q) || b.id.toLowerCase().includes(q))) return false;
    if (onlyOrders && b.totalOrders === 0) return false;
    if (onlyRisk && !isAtRisk(b)) return false;
    return true;
  });

  rows.sort((a, c) => {
    let av = a[sortKey], cv = c[sortKey];
    if (av === null || av === undefined) av = -Infinity;
    if (cv === null || cv === undefined) cv = -Infinity;
    if (typeof av === "string") { av = av.toLowerCase(); cv = cv.toLowerCase(); }
    if (av < cv) return -1 * sortDir;
    if (av > cv) return 1 * sortDir;
    return 0;
  });

  const body = document.getElementById("body");
  body.innerHTML = rows.map(b => {
    const risk = isAtRisk(b);
    const cells = COLUMNS.map(c => {
      let v = b[c.key];
      if (v === null || v === undefined || v === "") v = c.num ? "—" : "—";
      if (c.key === "dsrPct" || c.key === "rtoPct") v = (v === "—") ? "—" : v + "%";
      return `<td class="${c.num ? 'num' : ''}">${v}</td>`;
    }).join("");
    return `<tr class="${risk ? 'at-risk' : ''}">${cells}</tr>`;
  }).join("");
}

render();
</script>
